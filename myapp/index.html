<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />

    <!-- Inline so there is no favicon request to 404 on. The hexagon echoes the
         badge that sits on the seam between the two auth panels. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 1.5 28.5 8.75v14.5L16 30.5 3.5 23.25V8.75z' fill='%23e8151b'/%3E%3Cpath d='M16 8 23 12v8l-7 4-7-4v-8z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E"
    />

    <!--
      Sora carries the headings and buttons; Inter carries labels, inputs and
      body copy. Both are declared in src/index.css @theme as --font-display and
      --font-sans, and both have a system fallback stack there so a blocked or
      offline font request degrades instead of breaking the layout.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>VR-Nexus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
