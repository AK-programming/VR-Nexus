# VR-Nexus frontend — nginx config for serving the Vite build and proxying API.
#
# In production, the frontend container serves the static build from /usr/share/
# nginx/html and reverse-proxies /api and /ws to the backend container. This
# replaces what Vite's dev server proxy did in development.
#
# The upstream name "api" must match the service name in docker-compose.prod.yml.

upstream api_backend {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    # Static assets with hashed filenames get long cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API proxy — matches the Vite dev proxy config.
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File uploads can be large (tenders, evidence docs).
        client_max_body_size 100M;
    }

    # WebSocket proxy for real-time progress.
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connections can be long-lived.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA fallback — every route that is not a file or an API call gets
    # index.html, and React Router takes over from there.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
